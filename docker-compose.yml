version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    env_file:
      - Backend/.env
    environment:
      DATABASE_PATH: /data/chatbot.db
    volumes:
      - backend_data:/data
      - backend_cache:/app/cache
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: /api
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data:
  backend_cache:
